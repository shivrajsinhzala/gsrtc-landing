# The landing page. Static files only — it never touches the Node app on :8787, so a problem
# here cannot take the tracker down with it.
#
# Astro migration (2026-09-03): root now points at the Astro build output
# (/var/www/gsrtc-astro), directory-format (`/foo` -> `foo/index.html`), which is exactly what
# `try_files $uri $uri/ =404` below already expects — no change needed to that line. Everything
# added in this revision exists because the previous static build shipped `_headers` /
# `_redirects` (Cloudflare Pages / Netlify convention) which nginx never reads; those are real
# `add_header` / `return 301` directives here instead. The old build's output is left in place
# at /var/www/gsrtc for instant rollback — just point `root` back at it and reload.
server {
    server_name gsrtc.shivrajsinh.in;

    root /var/www/gsrtc-astro;
    index index.html;

    # Let certbot answer the ACME challenge before there is a certificate to serve.
    location /.well-known/acme-challenge/ { root /var/www/gsrtc-astro; }

    # A static site, not an SPA: falling back to /index.html made every unknown path answer
    # HTTP 200 with the homepage. That is a soft 404 — Google treats each mistyped or probed URL
    # as another copy of the homepage, so the site had unbounded duplicate content and no 404 at
    # all. Every internal link is an explicit path or /, so nothing depends on the fallback.
    # `$uri/index.html`, not the bare `$uri/` the pre-Astro build used — this is a directory-
    # format build now (`/gsrtc-tracker` is really the file `gsrtc-tracker/index.html` on disk),
    # and asking try_files to fall back to a bare directory reference makes nginx apply its own
    # automatic "this looks like a directory, redirect to add the trailing slash" behaviour —
    # verified live: every single clean URL, including `/` itself, came back 301 to a slashed
    # variant before this. Naming the exact filename instead makes nginx serve it directly, no
    # redirect, matching astro.config.mjs's `trailingSlash: 'never'` — the whole point of which
    # was that the URL the redirects above land on IS the final one, not one more hop away.
    #
    # Every HTML document (there is no other file type this catch-all actually reaches — CSS,
    # JS, images and the two sitemaps all have their own more specific location above, which
    # nginx matches ahead of this prefix regardless of file order) is revalidated on every
    # request, so a deploy is visible immediately rather than sitting behind whatever TTL an
    # edge cache picked on its own.
    location / { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache" always; }
    error_page 404 /404.html;
    # An error must never be cacheable. Cloudflare sits in front of this origin and will cache
    # a 404 that arrives without cache-control: measured on the sibling host, one request for a
    # file that did not exist yet was still being answered from the edge with cf-cache-status:
    # HIT minutes after the real file was deployed. A crawler asking inside that window is told
    # the file is missing — which is exactly what "Google could not fetch your sitemap" looks
    # like from the outside, long after the origin became correct.
    location = /404.html { internal; add_header Cache-Control "no-store" always; }

    # The 70 URLs this site used to serve as <slug>.html and that Google has indexed under that
    # exact address. Astro now serves each one extensionless (/gsrtc-tracker, not
    # /gsrtc-tracker.html) so every one of those addresses must 301 or the ranking they already
    # hold is thrown away on the switch. One generic rule rather than 70 individual ones, so a
    # page added later is covered automatically. $is_args$args preserves any query string
    # (campaign params, ?lang=gu) through the redirect.
    #
    # Exact-match locations (`location =`) below take precedence over this regex regardless of
    # file order, so /404.html and /index.html are not caught by it.
    location ~ ^/(.+)\.html$ { return 301 /$1$is_args$args; }

    # The old homepage spelling. Query string preserved on purpose: a `?lang=gu` link in
    # someone's messages or bookmarks was never a separately indexed URL (it was byte-identical
    # to `/`), but this is how it keeps working — the redirect lands on `/`, and that page's own
    # small inline script (the one client-side language check left on the site) reads the query
    # string from there and sends `?lang=gu` on to the real Gujarati document at /gu.
    location = /index.html { return 301 /$is_args$args; }

    # nginx's own MIME map serves these as text/xml and text/plain by default, which some
    # crawlers/validators are picky about — force the standard types explicitly.
    # Short, explicit freshness on the files a crawler reads. Without a Cache-Control the
    # edge picks its own TTL per datacenter, so a bad response captured once can outlive the fix
    # in one region while every hand check from another region looks perfectly healthy — which
    # is exactly how a sitemap reads fine to us and "could not be read" to Search Console.
    # nginx does NOT inherit server-level add_header into a location that declares its own —
    # adding Cache-Control here silently dropped X-Content-Type-Options, and this was the only
    # one of the three sitemaps on this account served without nosniff. Chrome then sniffed it
    # and rendered it as HTML (tags stripped, text run together) instead of an XML tree, which
    # is precisely what "Sitemap could not be read" looks like to a parser that trusts sniffing.
    # Every header this location needs must therefore be repeated in full.
    location ~* ^/(rss.xml|feed.xml)$ {
        types { } default_type application/xml; charset utf-8;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Astro's sitemap integration emits an index plus one child file rather than the single
    # sitemap.xml the previous build wrote by hand — robots.txt below points at the index.
    location ~* ^/(sitemap-index\.xml|sitemap-0\.xml)$ {
        types { } default_type application/xml; charset utf-8;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }
    location = /robots.txt {
        types { } default_type text/plain; charset utf-8;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Astro content-hashes everything it builds under /_astro/ — the same filename never means
    # two different things, so this is the one thing on the site safe to cache forever.
    location ^~ /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location ~* \.(css|js)$      { add_header Cache-Control "public, max-age=604800"; }
    location ~* \.(webp|png|svg) { add_header Cache-Control "public, max-age=2592000"; }

    # Astro's build carries a couple of files meant for a host that reads them as config
    # (_headers, _redirects — the Cloudflare Pages / Netlify convention this origin does not
    # use, ported into real nginx directives above instead) rather than as pages. Left
    # unreferenced they would otherwise just be two odd, publicly downloadable text files.
    location ~* ^/_(headers|redirects)$ { return 404; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gsrtc.shivrajsinh.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gsrtc.shivrajsinh.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = gsrtc.shivrajsinh.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name gsrtc.shivrajsinh.in;
    return 404; # managed by Certbot


}
